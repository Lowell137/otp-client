<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summoner — OTP Client</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: #181a1b;
    background-image:
      linear-gradient(rgba(24, 26, 27, 0.86), rgba(24, 26, 27, 0.96)),
      var(--otp-splash, none),
      linear-gradient(180deg, #181a1b 0%, #181a1b 60%, #181a1b 100%);
    background-position: center top;
    background-size: cover;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #e8e6e3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #otp-wrap { max-width: 1180px; margin: 0 auto; padding: 16px 20px 60px; }
  #otp-top { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  #otp-top h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 700; color: #e8e6e3; }
  #otp-back {
    width: 32px; height: 32px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: #212324;
    border: 1px solid #2c2f31;
    color: #c9ccd4;
    border-radius: 8px;
    padding: 0;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #otp-back svg { width: 16px; height: 16px; display: block; }
  #otp-back:hover { background: #1063b7; border-color: #1063b7; color: #fff; }

  /* Hero Section */
  #otp-hero { text-align: center; padding: 24px 0 12px; }
  #otp-hero h2 {
    font-size: 24px;
    margin: 0 0 16px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  /* OneTricks + DeepLoL Pill Search Bar */
  #otp-sbar {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 620px;
    margin: 0 auto;
    background: #212324;
    border: 1px solid #2c2f31;
    border-radius: 9999px;
    padding: 5px 6px 5px 8px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #otp-sbar:hover {
    border-color: #383d4c;
  }
  #otp-sbar:focus-within {
    border-color: #1063b7;
    box-shadow: 0 0 0 2px rgba(16, 99, 183, 0.35);
  }

  /* Region badge + dropdown — custom, no native select */
  #otp-sregbtn {
    background-color: #1c2333;
    border: 1px solid #2e3a52;
    border-radius: 999px;
    color: #7fb3ff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    padding: 5px 11px;
    cursor: pointer;
    outline: none;
    min-width: 56px;
  }
  #otp-sregbtn:hover { border-color: rgb(16, 99, 183); color: #a8ccff; }
  #otp-reglist {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    background: #12161d;
    border: 1px solid #2a3348;
    border-radius: 8px;
    padding: 4px;
    min-width: 110px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #otp-reglist.open { display: block; }
  #otp-reglist div {
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
    color: #e8e6e3;
  }
  #otp-reglist div:hover { background: rgb(16,99,183); color: #fff; }
  #otp-reglist div.sel { color: rgb(110,180,255); }

  /* Search Input */
  #otp-sinput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-radius: 0;
    color: #e8e6e3;
    font-size: 14px;
    font-family: inherit;
    padding: 8px 8px;
    outline: none;
  }
  #otp-sinput::placeholder {
    color: #8b8f92;
  }

  /* Search Button */
  #otp-sgo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #c2baaf;
    padding: 6px 12px;
    cursor: pointer;
    flex-shrink: 0;
    outline: none;
    transition: color 0.15s ease;
  }
  #otp-sgo:hover { color: #e8e6e3; }
  #otp-sgo * { pointer-events: none; }

  /* Sub Bar (Lobby) */
  #otp-subbar {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  #otp-slobby {
    background: #212324;
    border: 1px solid #2c2f31;
    color: #c2baaf;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  #otp-slobby:hover {
    background: #232526;
    border-color: #c2baaf;
    color: #ffffff;
  }
  #otp-slobby * { pointer-events: none; }

  /* Recent Chips */
  #otp-recent {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 14px 0 4px;
    min-height: 10px;
  }
  .otp-chip {
    background: #212324;
    border: 1px solid #2c2f31;
    color: #e8e6e3;
    border-radius: 9999px;
    padding: 4px 10px 4px 12px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .otp-chip:hover {
    border-color: #1063b7;
    background: #232526;
  }
  .otp-chip .rg {
    background: #1063b7;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    color: #fff;
  }
  .otp-chip .x { color: #8b8f92; padding: 0 2px; }
  .otp-chip .x:hover { color: #ef4444; }

  /* Queue Tabs & Refresh */
  #otp-qtabs { display: none; gap: 6px; margin: 18px 0 6px; }
  #otp-qtabs.show { display: flex; }
  .otp-qtab {
    background: #212324;
    border: 1px solid #2c2f31;
    color: #e8e6e3;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .otp-qtab:hover { border-color: #656e73; color: #fff; }
  .otp-qtab.sel {
    background: #1063b7;
    border-color: #1063b7;
    color: #fff;
  }
  #otp-refresh {
    display: none;
    margin: 10px 0 0 auto;
    background: #212324;
    border: 1px solid #2c2f31;
    color: #c2baaf;
    border-radius: 6px;
    font-size: 12px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #otp-refresh.show { display: block; }
  #otp-updated { font-size: 11px; color: #8b93a8; text-align: right; margin: 8px 0 2px; min-height: 14px; }
  #otp-refresh:hover { color: #fff; border-color: #656e73; }
  #otp-refresh.spin { animation: otp-spin 1s linear infinite; }
  @keyframes otp-spin { to { transform: rotate(360deg); } }

  /* Body Content & Profile Card */
  #otp-sbody { margin-top: 14px; font-size: 12.5px; }
  .otp-sprof {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    background: #212324;
    border: 1px solid #2c2f31;
    border-radius: 8px;
    padding: 16px 18px;
  }
  .otp-sprof img {
    width: 60px;
    height: 60px;
    border-radius: 6px;
    border: 1px solid #2c2f31;
  }
  .otp-sprof b {
    font-size: 18px;
    color: #ffffff;
  }
  .otp-sprof .lv {
    display: inline-block;
    margin-top: 4px;
    font-size: 11px;
    color: #c2baaf;
    background: #181a1b;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid #2c2f31;
  }

  /* DeepLoL Style Stats Summary Block */
  .otp-dl-summary-box {
    display: flex;
    align-items: stretch;
    background: #181a1b;
    border: 1px solid #2c2f31;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    gap: 16px;
  }
  .otp-sum-col-main {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-right: 16px;
    border-right: 1px solid #2c2f31;
    min-width: 320px;
  }
  .otp-sum-circle {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 4px solid #10b981;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: #e8e6e3;
    flex-shrink: 0;
  }
  .otp-sum-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .otp-sum-row-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .otp-sum-games {
    font-size: 14px;
    font-weight: 700;
    color: #e8e6e3;
  }
  .otp-sum-kda {
    font-size: 12px;
    font-weight: 700;
    color: #60a5fa;
  }
  .otp-sum-score {
    font-size: 14px;
    font-weight: 800;
    color: #ffd166;
    margin-left: auto;
  }
  .otp-sum-row-sub {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: #c2baaf;
  }
  .otp-sum-row-badges {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .otp-sum-badge-card {
    background: #181c26;
    border: 1px solid #282e3f;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .otp-sum-col-champs {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 0 16px;
    border-right: 1px solid #2c2f31;
    min-width: 220px;
  }
  .otp-sum-champ-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .otp-sum-champ-row img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
  }
  .otp-sum-champ-meta {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    font-size: 11px;
  }
  .otp-sum-champ-kda {
    font-size: 10px;
    color: #c2baaf;
  }

  .otp-sum-col-roles {
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* title at the top, level with "Champion Played" */
    gap: 12px;
    padding-left: 8px;
    flex: 1;
    min-width: 140px;
  }
  .otp-roles-title {
    font-size: 11px;
    font-weight: 700;
    color: #c2baaf;
  }
  .otp-roles-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 58px; /* 36 px bar + label, so tall bars no longer reach the title */
    padding-bottom: 4px;
  }
  .otp-role-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .otp-role-bar {
    width: 8px;
    border-radius: 3px;
    background: #2563eb;
    min-height: 4px;
    transition: height 0.2s ease;
  }
  .otp-role-icon {
    font-size: 10px;
    color: #c2baaf;
    font-weight: 600;
  }

  /* Section Titles */
  .otp-ssec {
    font-weight: 700;
    font-size: 12.5px;
    color: #e8e6e3;
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .otp-ssec::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 12px;
    background: #1063b7;
    border-radius: 2px;
  }

  /* DeepLoL 2-Column Layout */
  .otp-dl-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    margin-top: 14px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .otp-dl-grid { grid-template-columns: 1fr; }
  }

  /* Left Sidebar Cards */
  .otp-side-card {
    background: #212324;
    border: 1px solid #2c2f31;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .otp-side-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    color: #c2baaf;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .otp-side-champ {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #1f232e;
  }
  .otp-side-champ:last-child { border-bottom: none; }
  .otp-side-champ img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
  }
  .otp-side-champ-name {
    font-weight: 600;
    font-size: 12px;
    color: #e8e6e3;
  }
  .otp-side-champ-kda {
    font-size: 10.5px;
    color: #c2baaf;
  }
  .otp-side-champ-right {
    margin-left: auto;
    text-align: right;
  }
  .otp-side-champ-wr {
    font-weight: 700;
    font-size: 11.5px;
  }
  .otp-side-champ-count {
    font-size: 10.5px;
    color: #8b8f92;
  }

  /* DeepLoL Match Row */
  .otp-mrow {
    display: grid;
    grid-template-columns: 85px 140px 1fr 140px 110px 90px;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    border-left: 4px solid transparent;
    background: #212324;
    margin-bottom: 6px;
    border-top: 1px solid #2c2f31;
    border-right: 1px solid #2c2f31;
    border-bottom: 1px solid #2c2f31;
    transition: background 0.12s;
  }
  .otp-mrow:hover {
    background: #232526;
  }
  .otp-mrow.win {
    border-left-color: #2563eb;
    background: #101a2a;
    border-top-color: #1a2940;
    border-right-color: #1a2940;
    border-bottom-color: #1a2940;
  }
  .otp-mrow.win:hover { background: #142135; }
  .otp-mrow.lose {
    border-left-color: #dc2626;
    background: #201116;
    border-top-color: #381820;
    border-right-color: #381820;
    border-bottom-color: #381820;
  }
  .otp-mrow.lose:hover { background: #28141b; }

  .otp-m-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .otp-m-queue {
    font-weight: 700;
    font-size: 11.5px;
    color: #e8e6e3;
  }
  .otp-m-time {
    font-size: 10px;
    color: #c2baaf;
  }
  .otp-m-result {
    font-size: 11px;
    font-weight: 700;
  }
  .otp-m-result.win { color: #60a5fa; }
  .otp-m-result.lose { color: #f87171; }

  .otp-m-champbox {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .otp-m-champbox img.champ-icon {
    width: 40px;
    height: 40px;
    border-radius: 6px;
  }
  .otp-m-spells-runes {
    display: grid;
    grid-template-columns: 16px 16px;
    gap: 2px;
  }
  .otp-m-spells-runes img {
    width: 16px;
    height: 16px;
    border-radius: 3px;
  }

  .otp-m-kda {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.25;
  }
  .otp-m-kda-nums {
    font-weight: 700;
    color: #e8e6e3;
    font-size: 12.5px;
  }
  .otp-m-kda-ratio {
    font-size: 11px;
    color: #c2baaf;
  }

  .otp-m-ai {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .otp-m-tagbox {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .otp-m-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .otp-m-tag.tag-mvp { background: #ffd166; color: #111; }
  .otp-m-tag.tag-ace { background: #9333ea; color: #fff; }
  .otp-m-tag.tag-godlike { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
  .otp-m-tag.tag-solid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .otp-m-tag.tag-balanced { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
  .otp-m-tag.tag-messy { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

  /* Lobby & Multi-Search Rows */
  .otp-lobrow {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    background: #212324;
    margin-bottom: 4px;
    border: 1px solid #2c2f31;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .otp-lobrow:hover, .otp-cand:hover {
    border-color: #1063b7;
    background: #232526;
  }

  /* ==========================================================================
     EXACT DEEPLOL MATCH BREAKDOWN TABLE (Image 1 Replica)
     ========================================================================== */

  .otp-dl-card {
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 1px solid #2c2f31;
    font-size: 12px;
  }

  /* Team Specific Borders & Backgrounds */
  .otp-dl-card.side-red {
    border-color: #3e1a22;
  }
  .otp-dl-card.side-red .otp-dl-head {
    background: #271318;
    border-bottom: 1px solid #451b23;
  }
  .otp-dl-card.side-red .otp-dl-row {
    background: #1e1115;
    border-bottom: 1px solid rgba(239, 68, 68, 0.12);
  }
  .otp-dl-card.side-red .otp-dl-row:hover {
    background: #28161c;
  }
  .otp-dl-card.side-red .dmg-bar-fill {
    background: #ef4444;
  }

  .otp-dl-card.side-blue {
    border-color: #1a2b44;
  }
  .otp-dl-card.side-blue .otp-dl-head {
    background: #101a2a;
    border-bottom: 1px solid #1c2e4c;
  }
  .otp-dl-card.side-blue .otp-dl-row {
    background: #0e1623;
    border-bottom: 1px solid rgba(59, 130, 246, 0.12);
  }
  .otp-dl-card.side-blue .otp-dl-row:hover {
    background: #141f32;
  }
  .otp-dl-card.side-blue .dmg-bar-fill {
    background: #3b82f6;
  }

  .otp-dl-card .otp-dl-row:last-child {
    border-bottom: none;
  }

  /* Header Row */
  .otp-dl-head {
    display: grid;
    grid-template-columns: minmax(210px, 2.2fr) 76px 110px 105px 75px minmax(190px, 2fr);
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    font-size: 11.5px;
    color: #c2baaf;
    font-weight: 600;
  }
  .otp-dl-head-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .otp-dl-badge {
    color: #ffffff;
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    line-height: 1.3;
    text-transform: capitalize;
  }
  .otp-dl-badge.lose {
    background: #dc2626;
  }
  .otp-dl-badge.win {
    background: #1d4ed8;
  }
  .otp-dl-teamname {
    color: #c2baaf;
    font-size: 12px;
  }

  .otp-dl-head-cols {
    display: contents;
  }
  .otp-dl-head-cols .col-ai { text-align: center; }
  .otp-dl-head-cols .col-kda { text-align: center; }
  .otp-dl-head-cols .col-dmg { text-align: right; }
  .otp-dl-head-cols .col-cs { text-align: right; }
  .otp-dl-head-cols .col-items { text-align: left; }

  /* Player Row (5 per team) */
  .otp-dl-row {
    display: grid;
    grid-template-columns: minmax(210px, 2.2fr) 76px 110px 105px 75px minmax(190px, 2fr);
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    transition: background-color 0.12s ease;
  }

  /* Column 1: Player Cell */
  .otp-dl-pcell {
    display: flex;
