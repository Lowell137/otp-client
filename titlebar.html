<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OTP Client</title>
<style>
  :root {
    --bg: #0b0e14; --line: #1b1f2a; --text: #e8e6e3; --dim: #8f96a3; --mute: #5d6577;
    --hover: #171b25; --accent: #1063b7; --ok: #3fb950; --warn: #d29922; --live: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 36px; overflow: hidden; background: var(--bg); color: var(--text);
    font: 12px/1 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  #bar { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px;
    border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  .nodrag, button, input { -webkit-app-region: no-drag; }

  #brand { display: flex; align-items: center; gap: 7px; padding-right: 8px; margin-right: 2px; cursor: pointer; }
  #brand img { width: 18px; height: 18px; border-radius: 4px; display: block; }
  #brand b { font-size: 12px; font-weight: 700; letter-spacing: .02em; }

  .ib { width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 6px; color: var(--dim); cursor: pointer; padding: 0; }
  .ib svg { width: 15px; height: 15px; display: block; }
  .ib:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .ib:disabled { color: #353b49; cursor: default; }
  .ib.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; flex: none; }

  #tabs { display: flex; gap: 2px; }
  .tab { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--dim);
    font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.on { background: #15243a; color: #fff; }
  .tab .ch { color: #8ec2ff; font-weight: 600; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #search { position: relative; margin-left: 8px; }
  #q { width: 210px; height: 26px; background: #11151e; border: 1px solid #1f2533; border-radius: 6px;
    color: var(--text); font: inherit; padding: 0 44px 0 28px; outline: none; transition: border-color .15s, width .15s; }
  #q:focus { border-color: var(--accent); width: 260px; }
  #q::placeholder { color: var(--mute); }
  #search .mag { position: absolute; left: 9px; top: 6px; width: 14px; height: 14px; color: var(--mute); pointer-events: none; }
  #search kbd { position: absolute; right: 6px; top: 5px; font: 10px/14px system-ui, sans-serif; color: var(--mute);
    border: 1px solid #262c3a; border-radius: 4px; padding: 1px 4px; pointer-events: none; }

  #drag { flex: 1; align-self: stretch; }

  #lcu { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 12px;
    background: #11151e; border: 1px solid #1f2533; color: var(--dim); font-weight: 600; white-space: nowrap; }
  #lcu i { width: 7px; height: 7px; border-radius: 50%; background: #3a4150; flex: none; }
  #lcu.on i { background: var(--ok); }
  #lcu.cs i { background: var(--warn); box-shadow: 0 0 0 3px rgba(210,153,34,.18); }
  #lcu.game i { background: var(--live); box-shadow: 0 0 0 3px rgba(248,81,73,.18); }
  #lcu.on, #lcu.cs, #lcu.game { color: var(--text); }

  #caption { width: 138px; flex: none; } /* native min / max / close live here */

  @media (max-width: 1080px) { #search kbd { display: none; } #q { width: 150px; } #q:focus { width: 200px; } }
  @media (max-width: 960px) { #brand b { display: none; } #lcu span { display: none; } }
</style>
</head>
<body>
<div id="bar">
  <div id="brand" class="nodrag" title="onetricks.gg home"><img src="assets/logo.png" alt=""><b>OTP</b></div>
  <button class="ib" id="back" title="Back (Alt+←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
  <button class="ib" id="fwd" title="Forward (Alt+→)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
  <button class="ib" id="reload" title="Reload (F5)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg></button>
  <div class="sep"></div>
  <div id="tabs">
    <button class="tab" data-go="home" id="t-home">Builds<span class="ch" id="t-champ"></span></button>
    <button class="tab" data-go="tier" id="t-tier">Tier List</button>
    <button class="tab" data-go="summoner" id="t-summoner">Summoner</button>
  </div>
  <div id="search" class="nodrag">
    <svg class="mag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <input id="q" placeholder="Champion build…" autocomplete="off" spellcheck="false" list="champs">
    <datalist id="champs"></datalist>
    <kbd>Ctrl K</kbd>
  </div>
  <div id="drag"></div>
  <div id="lcu" title="League client"><i></i><span>Client offline</span></div>
  <div id="caption"></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const PHASE = {
    None: 'Client open', Lobby: 'In lobby', Matchmaking: 'In queue', ReadyCheck: 'Match found',
    ChampSelect: 'Champ select', GameStart: 'Loading', InProgress: 'In game', Reconnect: 'Reconnect',
    WaitingForStats: 'Post game', PreEndOfGame: 'Post game', EndOfGame: 'Post game',
  };

  $('#back').onclick = () => tb.go('back');
  $('#fwd').onclick = () => tb.go('forward');
  $('#reload').onclick = () => tb.go('reload');
  $('#brand').onclick = () => tb.go('home');
  document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => tb.go(b.dataset.go)));

  // Champion jump: native datalist, Enter opens the build page.
  let champs = [];
  tb.champs().then((list) => {
    champs = list || [];
    $('#champs').innerHTML = champs.map((c) => `<option value="${c.name}">`).join('');
  });
  const q = $('#q');
  function openChamp() {
    const v = q.value.trim().toLowerCase();
    if (!v) return;
    const norm = (s) => s.toLowerCase().replace(/[^a-z]/g, '');
    const hit = champs.find((c) => c.name.toLowerCase() === v)
      || champs.find((c) => norm(c.name) === norm(v))
      || champs.find((c) => c.name.toLowerCase().startsWith(v))
      || champs.find((c) => norm(c.name).includes(norm(v)));
    if (!hit) return;
    tb.go({ champ: hit.name.replace(/[^A-Za-z]/g, '') });
    q.value = ''; q.blur();
  }
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') openChamp();
    if (e.key === 'Escape') { q.value = ''; q.blur(); }
  });
  q.addEventListener('change', () => { if (champs.some((c) => c.name === q.value)) openChamp(); });
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  });

  tb.onFocusSearch(() => { q.focus(); q.select(); });

  tb.onState((s) => {
    $('#back').disabled = !s.canBack;
    $('#fwd').disabled = !s.canFwd;
    $('#reload').classList.toggle('spin', !!s.loading);
    const page = s.page === 'build' ? 'home' : s.page;
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.go === page));
    $('#t-champ').textContent = s.page === 'build' && s.champ ? '· ' + s.champ : '';

    const l = s.lcu || {};
    const el = $('#lcu');
    el.className = '';
    let label = 'Client offline';
    if (l.state === 'on') {
      label = PHASE[l.phase] || 'Client open';
      if (l.phase === 'ChampSelect') { el.classList.add('cs'); if (l.champ) label += ' · ' + l.champ; }
      else if (l.phase === 'InProgress' || l.phase === 'GameStart') el.classList.add('game');
      else el.classList.add('on');
    }
    el.querySelector('span').textContent = label;
    el.title = label;
  });
  tb.ready();
</script>
</body>
</html>
