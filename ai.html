<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant — OTP Client</title>
<style>
  :root {
    --text: #e8e6e3; --mute: #8b8f92; --soft: #c9c3bc; --bg: #181a1b; --fg: #212324; --raised: #2a2d2f;
    --line: #2c2f31; --line-hi: #656e73; --blue: #1063b7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; border-left: 1px solid var(--line); overflow: hidden;
  }
  button, select, input, textarea { font: inherit; color: var(--text); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }

  /* Left edge: drag to resize the panel */
  #grip { position: fixed; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; z-index: 40; }
  #grip:hover, #grip.on { background: rgba(16, 99, 183, .6); }

  /* 56 px bar like the app header; the right part stays free for the window buttons */
  #top { height: var(--barH, 56px); flex: none; display: flex; align-items: center; gap: 6px; padding: 0 146px 0 14px; background: var(--barBg, var(--fg)); border-bottom: 1px solid var(--line); user-select: none; }
  #top h1 { font-size: 14px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #top .sp { flex: 1; min-width: 4px; }
  .ib { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--soft); cursor: pointer; padding: 0; }
  .ib:hover { background: var(--raised); color: #fff; }
  .ib.on { background: var(--raised); color: #fff; border-color: var(--line); }

  #main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  #banner { display: none; margin: 10px 12px 0; background: var(--fg); border: 1px solid var(--line); border-left: 3px solid #d9a33a; border-radius: 8px; padding: 9px 12px; font-size: 12px; line-height: 1.5; }
  #banner.on { display: block; }
  #setup { display: none; margin: 12px; background: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-y: auto; }
  #setup.on { display: block; }
  #setup h3 { margin: 0 0 6px; font-size: 14px; }
  #setup p { margin: 0 0 8px; font-size: 12.5px; color: var(--soft); line-height: 1.5; }
  #setup .hw { font-size: 11.5px; color: var(--mute); margin-bottom: 10px; }
  #setup .models { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #setup .mc { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  #setup .mc.on { border-color: var(--blue); background: rgba(16, 99, 183, .12); }
  #setup .mc.no { opacity: .65; }
  #setup .mc input { margin-top: 2px; accent-color: var(--blue); }
  #setup .mc b { font-size: 12.5px; }
  #setup .mc i { font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  #setup .mc em { display: block; font-style: normal; font-size: 11.5px; color: var(--mute); margin-top: 2px; }
  #setup .row { display: flex; gap: 8px; margin-bottom: 8px; }
  #setup .hint { font-size: 11.5px; color: var(--mute); line-height: 1.5; margin-top: 4px; }
  #setup .hint a { color: #6cb2ff; }
  #setup.on ~ #log, #setup.on ~ #composeWrap { display: none; }
  #banner b { color: #f0c75e; }
  #banner code { background: #2c2f31; border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 94%; line-height: 1.55; font-size: 13.5px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--blue); color: #fff; padding: 8px 12px; border-radius: 12px 12px 3px 12px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; }
  .msg { animation: msgIn .22s ease-out both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Live status while the answer is on its way: shimmering label + seconds */
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mute); padding: 2px 0 6px; }
  .live .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-hi); border-top-color: var(--blue); animation: spin .8s linear infinite; flex: none; }
  .live .shim { background: linear-gradient(90deg, var(--mute) 0%, var(--mute) 35%, #fff 50%, var(--mute) 65%, var(--mute) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.6s linear infinite; }
  .live .secs { font-variant-numeric: tabular-nums; font-size: 11.5px; opacity: .7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  .live[hidden] { display: none; }
  .ans.streaming > :last-child:not(ul):not(ol)::after, .ans.streaming > :is(ul, ol):last-child > li:last-child::after { content: ''; display: inline-block; width: 7px; height: 13px; margin-left: 2px; vertical-align: -2px; background: var(--soft); border-radius: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .step { animation: msgIn .2s ease-out both; }
  .msg.bot p { margin: 0 0 6px; } .msg.bot p:last-child { margin: 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0 6px; padding-left: 20px; }
  .msg.bot code { background: #2c2f31; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .msg.bot b { color: #fff; }
  .err { color: #f0707a; }
  details.think { margin-bottom: 8px; font-size: 12.5px; color: var(--soft); }
  details.think summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--mute); user-select: none; padding: 2px 0; }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::before { content: '›'; display: inline-block; font-size: 15px; line-height: 1; transition: transform .15s; }
  details.think[open] summary::before { transform: rotate(90deg); }
  details.think summary:hover { color: var(--text); }
  details.think > div { margin-top: 6px; padding: 8px 10px; border-left: 2px solid var(--line-hi); background: rgba(255,255,255,.03); border-radius: 0 6px 6px 0; max-height: 260px; overflow-y: auto; line-height: 1.5; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .step { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--soft); background: var(--raised); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }
  .step .dot { width: 7px; height: 7px; border-radius: 50%; background: #d9a33a; animation: pulse 1s infinite; }
  .step.ok .dot { background: #2fb96b; animation: none; } .step.bad .dot { background: #e0605a; animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); animation: pulse 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }

  #empty { margin: auto; text-align: center; color: var(--mute); max-width: 320px; padding: 0 6px; }
  #empty h2 { color: var(--text); font-size: 15px; margin: 0 0 6px; }
  #empty .chips { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 14px; }
  #empty .chips button { background: var(--raised); border: 1px solid var(--line); border-radius: 18px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  #empty .chips button:hover { border-color: var(--line-hi); }

  /* Composer, chat-app style: attachments, then [+] text [send] in one rounded box;
     provider and model pickers on the line below. */
  #composeWrap { flex: none; padding: 0 12px 10px; }
  #compose { background: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  #compose:focus-within { border-color: var(--line-hi); }
  #compose.drop { border-color: var(--blue); background: #1d2733; }
  #atts { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 6px; }
  #atts:empty { display: none; }
  .att { position: relative; display: flex; align-items: center; gap: 6px; max-width: 180px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 4px 22px 4px 4px; font-size: 11.5px; color: var(--soft); }
  .att img { width: 34px; height: 34px; object-fit: cover; border-radius: 5px; display: block; }
  .att .fi { width: 28px; height: 28px; border-radius: 5px; background: #33373a; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; flex: none; }
  .att span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .att button { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border: 0; border-radius: 50%; background: #3a3d40; color: #fff; font-size: 10px; line-height: 1; cursor: pointer; padding: 0; }
  #crow { display: flex; align-items: flex-end; gap: 4px; }
  #q { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; font-size: 13.5px; line-height: 1.45; max-height: 160px; padding: 6px 4px; display: block; }
  #send { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); border: 0; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  #send:hover { filter: brightness(1.12); }
  #send:disabled { background: #33373a; color: #777; cursor: default; filter: none; }
  #send.stop { background: #e8e6e3; color: #181a1b; }
  #meta { display: flex; align-items: center; gap: 4px; padding: 6px 2px 0; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 60%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; color: var(--soft); cursor: pointer; font-size: 12px; }
  .chip:hover { background: var(--raised); color: #fff; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #2fb96b; flex: none; }
  .chip .dot.off { background: #e0605a; }
  #meta .sp { flex: 1; }
  /* Model menu */
  #menu { display: none; position: absolute; right: 12px; bottom: 44px; width: min(320px, calc(100% - 24px)); max-height: 60%; overflow-y: auto; background: var(--fg); border: 1px solid var(--line-hi); border-radius: 10px; padding: 6px; z-index: 25; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #menu.on { display: block; }
  #menu .mh { font-size: 11px; color: var(--mute); padding: 6px 8px 4px; }
  #menu .mi { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #menu .mi:hover { background: var(--raised); }
  #menu .mi span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu .mi i { font-style: normal; font-size: 11px; color: var(--mute); }
  #menu .mi.cur { color: #fff; }
  #menu .mi.cur::after { content: '✓'; color: #6cb2ff; }
  #menu .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  #menu .none { padding: 8px; color: var(--mute); font-size: 12px; }
  .msg.user .uatt { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .msg.user .uatt img { max-width: 120px; max-height: 90px; border-radius: 6px; display: block; }
  .msg.user .uatt span { font-size: 11px; background: rgba(255,255,255,.18); border-radius: 4px; padding: 2px 6px; }

  /* History list (over the chat) */
  #hist { display: none; position: absolute; inset: 0; background: var(--bg); z-index: 20; flex-direction: column; }
  #hist.on { display: flex; }
  #hist .hh { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
  #hist .hh b { font-size: 13px; flex: 1; }
  #hlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .hi { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .hi:hover { background: var(--fg); }
  .hi.cur { background: var(--fg); border-color: var(--line); }
  .hi .t { flex: 1; min-width: 0; }
  .hi .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .hi .t span { font-size: 11px; color: var(--mute); }
  .hi .x { opacity: 0; }
  .hi:hover .x { opacity: 1; }
  #hlist .none { color: var(--mute); text-align: center; padding: 30px 10px; font-size: 12.5px; }

  /* Settings */
  #set { display: none; position: absolute; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; }
  #set.on { display: block; }
  #set .box { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  #set h3 { margin: 0; font-size: 14px; }
  #set .tabs { display: flex; gap: 6px; }
  #set .tabs button { flex: 1; }
  .btn { background: var(--fg); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--line-hi); }
  .btn.pri, #set .tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  #set label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--soft); }
  #set input { background: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12.5px; outline: 0; }
  #set input:focus { border-color: var(--line-hi); }
  #set .hint { font-size: 11.5px; color: var(--mute); line-height: 1.5; }
  #set .row { display: flex; gap: 8px; justify-content: flex-end; }
  #set .box[hidden] { display: none; }
  #set .sh { display: flex; align-items: center; justify-content: space-between; }
  .pv { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .pv.on { border-color: var(--blue); background: rgba(16, 99, 183, .1); }
  .pv .t { flex: 1; min-width: 0; }
  .pv .t b { font-size: 12.5px; }
  .pv .t i { font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .pv .t span { display: block; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn.sm { padding: 4px 9px; font-size: 11.5px; }
  .sel { background: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; color: var(--text); }
  #menu .mh .off { color: #f0707a; font-weight: 400; }
</style>
</head>
<body>
<div id="grip" title="Drag to resize"></div>
<div id="top">
  <h1 id="title">Assistant</h1>
  <span class="sp"></span>
  <button class="ib" id="histBtn" title="Chat history"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="ib" id="newBtn" title="New chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <button class="ib" id="close" title="Close panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
</div>

<div id="main">
  <div id="banner"></div>
  <div id="setup"></div>
  <div id="log"></div>
  <div id="composeWrap">
    <div id="compose">
      <div id="atts"></div>
      <div id="crow">
        <button class="ib" id="attach" title="Add images or files"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <textarea id="q" rows="1" placeholder="Ask about players, items, your game…" spellcheck="false"></textarea>
        <button id="send" title="Send" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div id="meta">
      <button class="chip" id="provChip" title="Model settings"><i class="dot" id="provDot"></i><span id="provName">…</span></button>
      <span class="sp"></span>
      <button class="chip" id="modelChip" title="Choose model"><span id="modelName">…</span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 6 4 4 4-4"/></svg></button>
    </div>
    <input type="file" id="file" multiple hidden accept="image/*,.txt,.json,.log,.md,.csv">
  </div>
  <div id="menu"></div>

  <div id="hist">
    <div class="hh"><b>Chat history</b><button class="btn" id="histNew">New chat</button><button class="ib" id="histClose" title="Back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="hlist"></div>
  </div>

  <div id="set">
    <div class="box" id="setList">
      <div class="sh"><h3>Model providers</h3><button class="ib" id="setClose" title="Back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="hint">Add as many as you like; pick the model (and with it the provider) in the chat box.</div>
      <div id="provList"></div>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
        <select id="addPreset" class="sel">
          <option value="">Add a provider…</option>
          <option value="ollama">Ollama (local)</option>
          <option value="lmstudio">LM Studio</option>
          <option value="unsloth">Unsloth Studio</option>
          <option value="llamacpp">llama.cpp server</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom">Other OpenAI-compatible</option>
        </select>
        <button class="btn" id="setOllama">Set up Ollama</button>
      </div>
    </div>
    <div class="box" id="setEdit" hidden>
      <h3 id="editTitle">Provider</h3>
      <label>Name<input id="pName" placeholder="My server"></label>
      <label>Address<input id="pUrl" placeholder="http://127.0.0.1:1234/v1"></label>
      <label id="pKeyRow">API key<input id="pKey" type="password" placeholder="sk-… (if the server needs one)"></label>
      <div class="hint" id="keyState"></div>
      <label>Model<input id="pModel" list="pModels" placeholder="pick after Test, or type one"></label>
      <datalist id="pModels"></datalist>
      <div class="hint" id="pHint"></div>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="setTest">Test connection</button><span id="testOut" class="hint" style="align-self:center"></span></div>
      <div class="row"><button class="btn" id="setCancel">Cancel</button><button class="btn pri" id="setSave">Save</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const log = $('#log'), q = $('#q'), send = $('#send'), banner = $('#banner'), menu = $('#menu');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let chatId = newId();
  let history = [];
  let busyId = null;
  let cfg = null;
  let status = null;
  let models = [];
  let atts = []; // { kind: 'image'|'text', name, data (base64 for images), text, url }

  const TOOL_LABEL = {
    current_game: 'Checking the current game', player_profile: 'Looking up the player', player_matches: 'Reading match history',
    recommend_items: 'Checking the enemy team', tier_list: 'Reading the tier list', suggest_pick: 'Finding picks', counters: 'Checking matchups', esports: 'Checking pro play', lol_knowledge: 'Reading game notes', last_game: 'Loading the game', played_with: 'Checking who you play with', game_review: 'Reviewing the game', duo_synergy: 'Checking duo synergy', champion_build: 'Getting the build', patch_notes: 'Reading patch notes', lol_wiki: 'Searching the wiki', read_page: 'Reading a page',
  };
  // Start screen: suggestions follow what you are doing (out of game, champion
  // select, in game) and name your champion / lane opponent when known.
  function suggestions(c) {
    const me = c.champ || 'my champion';
    if (c.phase === 'select') return {
      title: 'Champion select',
      sub: c.champ ? `You are on ${c.champ}${c.role ? ' ' + c.role : ''}.` : 'Pick help from the current tier list.',
      chips: [
        [c.role ? `Suggest a strong pick for ${c.role}` : 'Suggest a strong pick for my role', c.role ? `Suggest a strong champion to pick for ${c.role} that is not banned or taken` : 'Suggest a strong champion to pick for my role that is not banned or taken'],
        ...(c.champ ? [[`Runes and build for ${c.champ}`, `What runes, items, spells and skill order should I use on ${c.champ}${c.role ? ' ' + c.role : ''}?`]] : []),

  // Small Markdown: bold, inline code, lists, paragraphs (HTML escaped first).
  function md(s) {

    const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const l of lines) {
      const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        const kind = ul ? 'ul' : 'ol';
        if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
        html += `<li>${inline((ul || ol)[1])}</li>`;
      } else if (!l.trim()) { close(); }
      else { close(); html += `<p>${inline(l.replace(/^#+\s*/, ''))}</p>`; }
    }
    close();
    return html;

    $('#provList').innerHTML = cfg.providers.map((p) => `<div class="pv${p.id === cfg.active ? ' on' : ''}">
      <div class="t"><b>${esc(p.name)}</b>${p.id === cfg.active ? '<i>In use</i>' : ''}<span>${esc(p.baseUrl || 'no address')}${p.model ? ' · ' + esc(p.model) : ''}</span></div>
      ${p.id === cfg.active ? '' : `<button class="btn sm" data-use="${esc(p.id)}">Use</button>`}
      <button class="ib" data-edit="${esc(p.id)}" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      ${cfg.providers.length > 1 ? `<button class="ib" data-del="${esc(p.id)}" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>` : ''}
    </div>`).join('');
    $('#setList').hidden = false;
    $('#setEdit').hidden = true;
    $('#set').classList.add('on');
  }
  function openEdit(p, preset) {
    editing = { id: p ? p.id : undefined, type: p ? p.type : preset.type };
    $('#editTitle').textContent = p ? `Edit ${p.name}` : `Add ${preset.name}`;
    $('#pName').value = p ? p.name : preset.name;
    $('#pUrl').value = p ? p.baseUrl : preset.baseUrl;
    $('#pModel').value = p ? p.model || '' : '';
    $('#pModels').innerHTML = ((p && p.models) || []).map((m) => `<option value="${esc(m)}">`).join('');
    $('#pKeyRow').style.display = editing.type === 'ollama' ? 'none' : '';
    $('#pKey').value = '';
    $('#pKey').placeholder = p && p.hasKey ? '•••••••••••••••• (saved)' : 'sk-… (if the server needs one)';
    $('#keyState').innerHTML = p && p.hasKey ? '<span style="color:#2fb96b">✓ Key saved (encrypted).</span> Type a new one to replace it, or <a href="#" id="keyRm" style="color:#6cb2ff">remove it</a>.' : '';
    const rm = $('#keyRm');
    if (rm) rm.onclick = async (e) => { e.preventDefault(); await window.otpAI.setConfig({ upsert: { id: p.id, clearKey: true } }); cfg = await window.otpAI.config(); openEdit(cfg.providers.find((x) => x.id === p.id), null); };
    $('#pHint').textContent = (preset && preset.hint) || (Object.values(PRESETS).find((x) => x.name === (p && p.name)) || {}).hint || '';
    $('#testOut').textContent = '';
    $('#setList').hidden = true;
    $('#setEdit').hidden = false;
  }
  $('#provList').addEventListener('click', async (e) => {
    const use = e.target.closest('[data-use]'), ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (use) { await window.otpAI.setConfig({ active: use.dataset.use }); await openSettings(); refreshStatus(); }
    else if (ed) openEdit(cfg.providers.find((p) => p.id === ed.dataset.edit), null);
    else if (del) { await window.otpAI.setConfig({ remove: del.dataset.del }); await openSettings(); refreshStatus(); }
  });
  $('#addPreset').onchange = () => { const k = $('#addPreset').value; $('#addPreset').value = ''; if (PRESETS[k]) openEdit(null, PRESETS[k]); };
  $('#setOllama').onclick = () => { $('#set').classList.remove('on'); forcedSetup = true; showSetup(); };
  $('#setClose').onclick = () => $('#set').classList.remove('on');
  const draft = () => ({ id: editing && editing.id, type: editing && editing.type, name: $('#pName').value, baseUrl: $('#pUrl').value, key: $('#pKey').value });
  $('#setTest').onclick = async () => {
    const out = $('#testOut');
    out.style.color = ''; out.textContent = 'Testing…';
    const r = await window.otpAI.test(draft());
    if (r.ok) {
      out.style.color = '#2fb96b';
      out.textContent = `Connected · ${r.models.length} model${r.models.length === 1 ? '' : 's'}`;
      $('#pModels').innerHTML = r.models.map((m) => `<option value="${esc(m)}">`).join('');
      if (!$('#pModel').value && r.models[0]) $('#pModel').value = r.models[0];
      editing.models = r.models;
    } else { out.style.color = '#f0707a'; out.textContent = r.error; }
  };
  $('#setCancel').onclick = () => openSettings();
  $('#setSave').onclick = async () => {
    const d = draft();
    await window.otpAI.setConfig({ upsert: { id: d.id, type: d.type, name: d.name, baseUrl: d.baseUrl, model: $('#pModel').value, key: d.key, models: editing.models, makeActive: !d.id } });
    await openSettings();
    refreshStatus();
  };

  // ---- Panel: close, resize from the left edge, move the window from the top bar ----
  $('#close').onclick = () => window.otpAI.close();
  const grip = $('#grip');
  let rs = false;
  grip.addEventListener('pointerdown', (e) => { if (e.button) return; rs = true; grip.setPointerCapture(e.pointerId); grip.classList.add('on'); e.preventDefault(); });
  grip.addEventListener('pointermove', (e) => { if (rs) window.otpAI.resize(e.screenX); });
  const rsEnd = () => { if (!rs) return; rs = false; grip.classList.remove('on'); window.otpAI.resizeEnd(); };
  grip.addEventListener('pointerup', rsEnd); grip.addEventListener('pointercancel', rsEnd);
  const top = $('#top');
  let dg = false;
  top.addEventListener('pointerdown', (e) => {
    if (e.button || e.target.closest('button')) return;
    if (e.detail > 1) { window.otpAI.winDrag('max'); return; }
    dg = true; top.setPointerCapture(e.pointerId); window.otpAI.winDrag('start'); e.preventDefault();
  });
  top.addEventListener('pointermove', () => { if (dg) window.otpAI.winDrag('move'); });
  const dgEnd = () => { if (!dg) return; dg = false; window.otpAI.winDrag('end'); };
  top.addEventListener('pointerup', dgEnd); top.addEventListener('pointercancel', dgEnd);

  // Start: reopen the last chat.
  (async () => {
    let last = '';
    try { last = localStorage.getItem('otp.ai.current') || ''; } catch {}
    if (last) await openChat(last);
    if (!history.length) showChat();
    refreshStatus();
    updateSend();
    q.focus();
  })();
})();
</script>
</body>
</html>
